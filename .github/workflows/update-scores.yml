name: Update Live Scores
on:
  schedule:
    # Every 15 minutes from 5 PM to midnight MT (23:00 - 06:00 UTC).
    # Offset to :09/:24/:39/:54 rather than the exact quarter-hour marks
    # on purpose - GitHub's scheduler queues jobs landing on round minutes
    # behind every other repo's jobs at that same instant platform-wide;
    # confirmed live this pattern elsewhere in this repo at the exact hour
    # mark (minute 0) causing multi-hour delays on once-daily jobs.
    #
    # Kept on GitHub's own scheduler (unlike the once-daily jobs) rather
    # than moved to external triggering: 15-minute in-game score polling
    # doesn't need the same clock-time precision the morning pipeline
    # does, and ~52 external dispatch calls/day is a lot to hand to a
    # free cron service for marginal benefit here.
    - cron: '9-59/15 23 * * *'
    - cron: '9-59/15 0-6 * * *'
  workflow_dispatch:  # manual/ad-hoc trigger, e.g. to backfill a missed run

jobs:
  update-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Fetch live scores
        run: python .github/scripts/update_scores.py

      - name: Commit scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json
          git diff --staged --quiet || git commit -m "Update scores $(date -u '+%H:%M')"
          git push
