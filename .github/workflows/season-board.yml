name: Season Board
on:
  # No schedule: block - see update-ticker.yml's comment for why. Daily
  # refresh (goalie/opponent data changes every day) now comes from an
  # external cron-job.org job calling workflow_dispatch instead, for real
  # clock-time control. The workflow_run trigger below is untouched - it's
  # event-chained off Schedule Analysis's completion, not cron-delayed, so
  # it was never part of the problem this migration is fixing.
  workflow_run:
    # build_season_board.py reads data/schedule_analysis.json - this
    # chains an immediate extra run right after that data actually
    # changes (weekly, Sundays) instead of waiting up to a day for the
    # next scheduled run to pick it up. The daily schedule above still
    # covers every other day, since season board needs fresher-than-weekly
    # goalie/opponent data regardless of whether the schedule itself moved.
    workflows: ["Schedule Analysis"]
    types: [completed]
  workflow_dispatch:

jobs:
  build-season-board:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - name: Build season board
        run: python .github/scripts/build_season_board.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/season_board.json
          git diff --staged --quiet || git commit -m "Update season board $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
