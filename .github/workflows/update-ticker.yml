name: Update Ticker Data
on:
  # No schedule: block - GitHub Actions' own scheduler queues top-of-hour
  # cron jobs behind every other repo's jobs platform-wide; confirmed live
  # this workflow was landing 3-5.5 hours late every day for 15+ straight
  # days even after moving off the exact hour mark. Triggered externally
  # via workflow_dispatch by a cron-job.org job instead, for real
  # clock-time control. update-fantasy.yml's workflow_run trigger still
  # fires automatically right after this completes, unaffected.
  workflow_dispatch:
jobs:
  update-ticker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pytz beautifulsoup4
      - name: Fetch injury/scratch data
        run: python .github/scripts/fetch_injuries.py
      - name: Generate ticker data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python .github/scripts/update_ticker.py
      - name: Generate dashboard data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python .github/scripts/update_dashboard.py
      - name: Generate ROI data
        run: python .github/scripts/update_roi.py
      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json data/dashboard.json data/roi.json data/scratches.json data/emerging_edge_log.json data/goalie_starts_live_cache.json
          git diff --staged --quiet || git commit -m "Update dashboard data $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
