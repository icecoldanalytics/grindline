name: Update Ticker Data
on:
  schedule:
    - cron: '0 13 * * *'  # 7 AM MST
  workflow_dispatch:
jobs:
  update-ticker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pytz beautifulsoup4
      - name: Fetch injury/scratch data
        run: python .github/scripts/fetch_injuries.py
      - name: Generate ticker data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python .github/scripts/update_ticker.py
      - name: Generate dashboard data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python .github/scripts/update_dashboard.py
      - name: Generate ROI data
        run: python .github/scripts/update_roi.py
      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json data/dashboard.json data/roi.json data/scratches.json
          git diff --staged --quiet || git commit -m "Update dashboard data $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
