name: Player Hub
on:
  # No schedule: block - see update-ticker.yml's comment for why (GitHub's
  # own scheduler ran every daily job in this repo 3-5+ hours late, even
  # off the top of the hour). Triggered externally via workflow_dispatch
  # by a cron-job.org job instead, for real clock-time control.
  workflow_dispatch:

jobs:
  build-player-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Build player hub
        run: python .github/scripts/build_player_hub.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_hub.json data/player_prior_seasons_cache.json
          git diff --staged --quiet || git commit -m "Update player hub $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
