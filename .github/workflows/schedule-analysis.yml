name: Schedule Analysis
on:
  schedule:
    - cron: '0 12 * * 0'  # weekly, Sunday - the NHL schedule is static
                            # once published except for rare reschedules
  workflow_dispatch:

jobs:
  build-schedule-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python .github/scripts/build_schedule_analysis.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule_analysis.json
          git diff --staged --quiet || git commit -m "Update schedule analysis $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
