name: Schedule Analysis
on:
  # No schedule: block - see update-ticker.yml's comment for why. Triggered
  # externally via workflow_dispatch by a cron-job.org job instead (weekly,
  # Sunday - the NHL schedule is static once published except for rare
  # reschedules), for real clock-time control. season-board.yml's
  # workflow_run trigger still fires automatically right after this
  # completes, unaffected by this change.
  workflow_dispatch:

jobs:
  build-schedule-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python .github/scripts/build_schedule_analysis.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule_analysis.json
          git diff --staged --quiet || git commit -m "Update schedule analysis $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
