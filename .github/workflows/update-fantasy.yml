name: Update Fantasy Picks
on:
  workflow_run:
    # update_fantasy.py reads data/dashboard.json and data/scratches.json,
    # both written by Update Ticker Data - this used to rely on that
    # workflow's 13:00 UTC schedule finishing before this one's 17:00 UTC
    # schedule started, but confirmed live that Update Ticker Data was
    # itself landing as late as 18:30 UTC some days, meaning this job
    # could genuinely run BEFORE its own upstream data was fresh for the
    # day and silently generate picks off yesterday's dashboard. Chaining
    # on workflow_run instead of a second independent schedule makes the
    # ordering guaranteed rather than merely usually-true.
    workflows: ["Update Ticker Data"]
    types: [completed]
  workflow_dispatch:

jobs:
  update-fantasy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Generate fantasy picks
        id: fantasy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # continue-on-error: this step aborts (exit 1) and skips writing
        # fantasy.json if roster fetches failed for too many of tonight's
        # teams even after retries, or if goalie/prop generation failed
        # outright (e.g. the Claude API), keeping the previous file rather
        # than generating picks from a gutted context - see
        # update_fantasy.py's abort guards. Without this flag, that abort
        # would also skip prop grading below, which is unrelated (it
        # grades past picks, not tonight's). The commit step's own git-add
        # only picks up fantasy.json if this step actually wrote it.
        #
        # continue-on-error hides the failure from the job's overall
        # conclusion, though - confirmed live, this is exactly how
        # fantasy.json sat on a two-week-old placeholder with every run
        # showing green. The "Fail the job if..." step below reads this
        # step's pre-override outcome and turns the job red on a genuine
        # abort, while still letting prop grading and the commit run.
        continue-on-error: true
        run: python .github/scripts/update_fantasy.py

      - name: Grade prop picks and update ROI
        run: python .github/scripts/update_prop_roi.py

      - name: Commit fantasy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fantasy.json data/prop_log.json data/prop_roi.json
          git diff --staged --quiet || git commit -m "Update fantasy picks $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push

      - name: Fail the job if fantasy picks generation aborted
        # Runs last, after prop grading and the commit, so neither is
        # skipped on a genuine abort - it exists only to flip the job's
        # overall conclusion to red afterward.
        if: steps.fantasy.outcome == 'failure'
        run: |
          echo "update_fantasy.py exited non-zero - see the 'Generate fantasy picks' step's log above for why (roster fetch, Claude API error, etc). fantasy.json was left unchanged."
          exit 1
