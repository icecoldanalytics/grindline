name: Capture signals

on:
  # No schedule: block - GitHub's own scheduler was landing this job
  # 3-5 hours late every day even off the top of the hour (queues behind
  # every other repo's cron jobs platform-wide), which mattered here
  # specifically because logged prices are whatever's live when the
  # script actually runs (see price_source in signal_log.json). Triggered
  # externally via workflow_dispatch by a cron-job.org job hitting this
  # repo's actions/workflows/capture-signals.yml/dispatches endpoint
  # instead, for real clock-time control.
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - run: python .github/scripts/capture_signals.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signal_log.json
          git diff --staged --quiet || git commit -m "Capture signals $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
