name: Capture signals

on:
  schedule:
    # Off the top of the hour on purpose - confirmed live this workflow
    # was landing 3-5 hours late every day at :00 (GitHub's scheduler
    # queues top-of-hour cron jobs behind every other repo's top-of-hour
    # jobs platform-wide). Logged prices are whatever's live when the
    # script actually runs (see price_source in signal_log.json), so
    # this delay directly affects how close to a real, takeable price
    # the logged number is - not just a cosmetic timing issue.
    - cron: '11 14 * * *'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz
      - run: python .github/scripts/capture_signals.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signal_log.json
          git diff --staged --quiet || git commit -m "Capture signals $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
